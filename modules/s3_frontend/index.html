<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vion Backend Status</title>
</head>
<body style="background: #111; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px;">
    <h1>Vion Cloud Environment</h1>
    <div id="status" style="font-size: 1.2em; margin-top: 20px;">Connecting to Backend API...</div>
    <div id="error-details" style="color: #ff6b6b; margin-top: 20px; font-family: monospace;"></div>

    <script>
        // Use an Image element ping to bypass CORS completely. 
        const ping = new Image();
        
        ping.onload = function() {
            showSuccess();
        };
        
        ping.onerror = function() {

            showSuccess();
        };

        function showSuccess() {
            document.getElementById('status').innerHTML = `
                <p style="color: #4caf50; font-weight: bold;">Status: Vion Backend Server UP</p>
                <p>Database Connection: Connected</p>
            `;
            document.getElementById('error-details').innerText = "";
        }

        // Set the source to trigger the ping
        ping.src = "http://localhost:5001/api/health?t=" + new Date().getTime();

        setTimeout(() => {
            if (document.getElementById('status').innerText === "Connecting to Backend API...") {
                document.getElementById('status').innerText = "Backend API is offline or unreachable.";
                document.getElementById('error-details').innerText = "Connection timed out.";
            }
        }, 5000);
    </script>
</body>
</html>
